name: release

# 打 tag（例如 v0.2.1）并 push 后，自动创建 GitHub Release。
# 插件的「检查更新」读取的正是 Releases API 的 latest release，
# 所以发版流程 = 改版本号 → commit → tag → push。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js

      - name: Offline smoke test
        run: node scripts/smoke.mjs

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
